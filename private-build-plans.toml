# Put your custom build plans here

[buildPlans.IosevkaYlagr]
family = "Iosevka Ylagr"
spacing = "term"
serifs = "sans"
noCvSs = false
exportGlyphNames = true
noLigation = true

    [buildPlans.IosevkaYlagr.metricOverride]
    # 1150 显示52行
    # leading = 1150
    # 1130显示55行
    # leading = 1130
    leading = 1250
    cap = 665
    ascender = 665
    xHeight = 480
    accentHeight = 136
    parenSize = 840
    # sb默认为60，调整到58后，字符显得挤了点
    # sb = 59

[buildPlans.IosevkaYlagr.variants.design]
two = "straight-neck-serifless"
four = "closed-serifless"
zero = "oval-slashed"
capital-d = "more-rounded-serifless"
capital-j = "serifed-both-sides"
capital-q = "crossing"
capital-u = "toothless-rounded-serifless"
capital-z = "straight-serifless-with-horizontal-crossbar"
g = "double-storey"
i = "serifed-flat-tailed"
k = "cursive-bottom-right-serifed"
l = "serifed-flat-tailed"
n = "straight-motion-serifed"
p = "eared-serifless"
r = "serifless"
u = "toothed-bottom-right-serifed"
y = "curly-turn-motion-serifed"
z = "straight-serifless-with-horizontal-crossbar"
cyrl-er = "eared-serifless"
punctuation-dot = "round"
tilde = "low"
brace = "straight"

[buildPlans.IosevkaYlagr.variants.italic]
two = "curly-neck-serifless"
four = "semi-open-serifless"
capital-d = "standard-serifless"
capital-z = "straight-serifless-with-crossbar"
g = "single-storey-serifed"
i = "tailed-serifed"
j = "serifed"
k = "diagonal-tailed-cursive-top-left-serifed"
l = "tailed-serifed"
n = "tailed-motion-serifed"
p = "eared-serifless"
q = "top-cut-diagonal-tailed-serifless"
r = "compact-top-serifed"
u = "tailed-motion-serifed"
y = "curly-turn-motion-serifed"
z = "straight-serifless-with-crossbar"

[buildPlans.IosevkaYlagr.weights.Regular]
shape = 400
menu = 400
css = 400

[buildPlans.IosevkaYlagr.weights.Bold]
shape = 700
menu = 700
css = 700

[buildPlans.IosevkaYlagr.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"

[buildPlans.IosevkaYlagr.slopes.Italic]
angle = 9.8
shape = "italic"
menu = "italic"
css = "italic"

# To enable TTC building, uncomment the following section and write your collect plans
