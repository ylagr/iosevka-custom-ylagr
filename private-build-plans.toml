# Put your custom build plans here


################ normal ##############
[buildPlans.IosevkaYlagr]
family = "Iosevka Ylagr"
spacing = "term"
serifs = "sans"
noCvSs = false
exportGlyphNames = true
noLigation = true

    [buildPlans.IosevkaYlagr.metricOverride]
    # 1150 显示52行
    # leading = 1150
    # 1130显示55行
    # leading = 1130
    # leading = 1250  # default
    leading = 1250
    # cap = 735  # default
    cap = 625
    # ascender = 735  # default
    ascender = 625
    # descender = -205  # default 不允许修改
    # descender = -174
    # xHeight = 530  # default
    xHeight = 450
    # accentHeight = 136  # default
    accentHeight = 136
    # parenSize = 966  # default
    parenSize = 821
    # sb默认为60，调整到58后，字符显得挤了点
    sb = 59   
    # 3. 【解决 Emacs 挤压的核心】往上下两端强行塞入硬空白
    # 不起作用 在底部强行垫 80 个单位的纯空白，逼迫 Emacs 露出底部间距
    # descenderPad = 80          
    
    # 配合顶部的系统垫片，这样上下都有保护层，Emacs 无论如何也裁剪不动它
    winMetricAscenderPad = 280
    winMetricDescenderPad = 175

